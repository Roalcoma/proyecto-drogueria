name: Build frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend_pedidos_drogueria_v1.2/src/**'
      - 'frontend_pedidos_drogueria_v1.2/index.html'
      - 'frontend_pedidos_drogueria_v1.2/vite.config.*'
      - 'frontend_pedidos_drogueria_v1.2/package.json'
      - 'frontend_pedidos_drogueria_v1.2/.env.production'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend_pedidos_drogueria_v1.2/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend_pedidos_drogueria_v1.2
        run: npm ci

      - name: Build
        working-directory: frontend_pedidos_drogueria_v1.2
        run: npm run build-only

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend_pedidos_drogueria_v1.2/dist/
          git diff --staged --quiet && echo "Sin cambios en dist" && exit 0
          git commit -m "build: actualizar dist del frontend [skip ci]"
          git push
